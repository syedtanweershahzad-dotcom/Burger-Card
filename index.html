<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Restaurant Card</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/script.js" defer></script>
</head>
<body>

  <div class="coupon">
    <div class="header">
      <h3>🍔 Burger Restaurant</h3>
    </div>

    <div class="image">
      <img src="assets/images/images5.jpg" alt="Burger">
    </div>

    <div class="body">
      <div class="offer">20% OFF</div>
      <p>Delicious Burger Near Surjani North Karachi. Only Rs. 400!</p>
      
      <div class="code" id="promoCode">BOH232</div>
      <br>
      <button class="btn" id="orderBtn">Order Now</button>
    </div>
  </div>

  <!-- Popup Notification -->
  <div class="popup" id="popup"></div>

</body>
</html>
